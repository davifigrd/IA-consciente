# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 💡 SOLUÇÃO DEFINITIVA:
      # Criamos uma pasta temporária de build ('dist'), copiamos o conteúdo de 'html' para a raiz dela,
      # e depois copiamos as pastas css, js e videos para dentro dela no mesmo nível relativo!
      # Isso simula perfeitamente sua estrutura sem quebrar nenhum link e sem alterar seu PC.
      - name: Assemble deployment directory
        run: |
          mkdir dist
          cp -r html/* dist/
          cp -r css dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true
          cp -r videos dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicamos apenas a pasta temporária que criamos com a estrutura perfeita
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
