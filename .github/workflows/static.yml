# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 💡 O PULO DO GATO CLEAN:
      # Este comando apenas faz uma cópia temporária do seu index.html para a raiz 
      # dentro do servidor de publicação do GitHub. 
      # Isso NÃO altera nada nas suas pastas locais e nem cria arquivos visíveis no seu repositório!
      - name: Copy index to root for deployment
        run: cp html/index.html ./index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Enviamos o repositório inteiro para que o CSS/JS/Vídeos externos continuem acessíveis
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
